services:
  app:
    build: .
    restart: unless-stopped
    environment:
      SEED_DEMO_DATA: "1" # inserts demo zones only when the DB has none
    volumes:
      - r53data:/data # SQLite lives here; survives rebuilds and restarts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN, e.g. route53.example.com or <server-ip>.sslip.io}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  r53data:
  caddy_data:
  caddy_config:
